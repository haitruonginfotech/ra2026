<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RA2 Mod Editor</title>
<style>
:root{
  --paper:#E6EAEE; --panel:#F8FAFB; --ink:#17212B; --muted:#5D6A77; --line:#CBD3DA; --line2:#DEE4E9;
  --steel:#2B3743; --steel2:#3A4856;
  --amber:#B97A06; --amber-bg:#FFF3D1; --amber-line:#E7B341;
  --allied:#2F6DB5; --soviet:#B8322A; --yuri:#7340A8; --neutral:#5D6A77;
  --ok:#2E7D4F; --danger:#B8322A;
  --head:'Bahnschrift','DIN Alternate','Barlow Semi Condensed','Segoe UI',system-ui,sans-serif;
  --body:'Segoe UI',system-ui,-apple-system,'Inter',sans-serif;
  --mono:'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--allied);outline-offset:2px}
.hidden{display:none!important}

/* top bar */
.bar{height:56px;background:var(--steel);color:#E9EEF2;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:3px solid #1D262F}
.brand{font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:.01em;font-stretch:semi-condensed;white-space:nowrap}
.brand small{font-weight:400;opacity:.65;font-size:13px;margin-left:6px}
.seg{display:flex;background:#1F2933;border-radius:6px;padding:3px}
.seg button{border:0;background:none;color:#B9C4CE;padding:5px 12px;border-radius:4px;cursor:pointer;font-family:var(--head);font-size:14px;white-space:nowrap}
.seg button[aria-pressed=true]{background:#E9EEF2;color:var(--ink)}
.src{font-size:12.5px;color:#B9C4CE;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.src b{color:#fff;font-weight:600}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.bar .btn{font-size:13px;padding:6px 10px}
.btn:hover{border-color:#9AA7B3}
.bar .btn{background:var(--steel2);border-color:#53616E;color:#E9EEF2}
.bar .btn:hover{border-color:#8A98A5}
.btn.primary{background:#E9EEF2;color:var(--ink);border-color:#E9EEF2;font-weight:600}
.bar .btn.primary{background:#F2C14E;border-color:#F2C14E;color:#2B2005}
.btn:disabled{opacity:.45;cursor:not-allowed}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:#F2C14E;color:#2B2005;font-size:12px;font-weight:700;text-align:center;margin-left:4px}

/* layout */
.app{display:grid;grid-template-columns:330px 1fr;height:calc(100% - 56px)}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.search{padding:12px 12px 8px}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.A[aria-pressed=true]{background:var(--allied);border-color:var(--allied)}
.chip.S[aria-pressed=true]{background:var(--soviet);border-color:var(--soviet)}
.chip.Y[aria-pressed=true]{background:var(--yuri);border-color:var(--yuri)}
.cats{display:flex;flex-wrap:wrap;gap:2px;padding:0 8px 8px;border-bottom:1px solid var(--line)}
.cats button{border:0;background:none;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--muted)}
.cats button[aria-pressed=true]{background:#E1E7EC;color:var(--ink);font-weight:600}
.opts{padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line2)}
.list{overflow:auto;flex:1;padding:4px 0}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:5px 12px;cursor:pointer;border-left:3px solid transparent}
.row:hover{background:#EEF2F5}
.row[aria-selected=true]{background:#E1E7EC;border-left-color:var(--ink)}
.row img,.row .noimg{width:48px;height:38px;border-radius:3px;object-fit:cover;display:block}
.noimg{background:repeating-linear-gradient(45deg,#E1E7EC 0 6px,#EEF2F5 6px 12px);border:1px solid var(--line2)}
.row .t{min-width:0}
.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .i{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.row .c{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row.off .n{color:var(--muted);font-weight:400}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.mod-mark{color:var(--amber);font-weight:700;margin-left:4px}

main{overflow:auto;min-width:0}
.view{max-width:1060px;padding:22px 28px 80px}
.empty{padding:60px 28px;color:var(--muted);max-width:640px}
.empty h2{font-family:var(--head);color:var(--ink);font-size:24px;margin:0 0 8px}

/* dossier */
.dossier{display:grid;grid-template-columns:144px 1fr;gap:20px;align-items:start;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.dossier .cam{width:144px;height:115px;border-radius:4px;object-fit:cover;display:block;box-shadow:0 0 0 1px #0002}
.dossier .cam.noimg{border-radius:4px}
.dossier h1{font-family:var(--head);font-size:32px;line-height:1.05;margin:0;font-weight:700;font-stretch:semi-condensed}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:6px 0 10px;color:var(--muted);font-size:13px}
.meta code{font-family:var(--mono);background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--ink)}
.side-tag{font-weight:700;font-size:12.5px;padding:1px 8px;border-radius:4px;color:#fff}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px;max-width:640px}
.bars .lab{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.bars .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.bars .track{height:6px;background:#D5DCE2;border-radius:3px;overflow:hidden;margin-top:3px}
.bars .fill{height:100%;background:var(--ink);border-radius:3px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

section.grp{margin-top:22px}
section.grp>h3{font-family:var(--head);font-size:17px;font-weight:700;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
section.grp>p.gh{margin:-4px 0 10px;color:var(--muted);font-size:13px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.f{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:8px 10px 9px;position:relative}
.f label{display:block;font-weight:600;font-size:13px}
.f .k{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.f .h{font-size:12px;color:var(--muted);margin:1px 0 6px;line-height:1.35}
.f input[type=text],.f input[type=number],.f select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff}
.f .numrow{display:flex;gap:4px}
.f .numrow input{flex:1;min-width:0}
.f .numrow button{border:1px solid var(--line);background:#F3F6F8;border-radius:5px;padding:0 7px;cursor:pointer;font-size:12px}
.f.changed{border-color:var(--amber-line);background:var(--amber-bg)}
.f.changed::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;background:var(--amber);border-radius:6px 0 0 6px}
.f .was{font-size:11.5px;color:var(--amber);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.f .was button{border:0;background:none;color:var(--amber);text-decoration:underline;cursor:pointer;padding:0;font-size:11.5px}
.f .orig{font-size:11.5px;color:var(--muted);margin-top:3px}
.f.wide{grid-column:1/-1}
.toggle{display:flex;align-items:center;gap:8px;margin-top:4px}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.checks label{font-weight:400;font-size:13px;display:flex;align-items:center;gap:5px}
.checks .sw{display:inline-block;width:8px;height:8px;border-radius:50%}
.wlink{display:flex;gap:6px;align-items:center;margin-top:5px;font-size:12px;color:var(--muted)}
.wlink a{color:var(--allied);cursor:pointer;text-decoration:underline}
.verses{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.verses .f label{font-size:12.5px}

table.raw{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line2);border-radius:6px;overflow:hidden;font-size:13px}
table.raw td{border-bottom:1px solid var(--line2);padding:3px 8px;vertical-align:middle}
table.raw td.key{font-family:var(--mono);font-size:12px;width:34%;color:#33404C}
table.raw input{width:100%;border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:4px;font-family:var(--mono);font-size:12px}
table.raw input:hover{border-color:var(--line)}
table.raw input:focus{border-color:var(--allied);background:#fff}
table.raw tr.changed td{background:var(--amber-bg)}
table.raw td.x{width:28px;text-align:center}
table.raw td.x button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{padding:5px 8px;border:1px solid var(--line);border-radius:5px;font-family:var(--mono);font-size:12px}
.uses{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.uses a{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line2);border-radius:5px;padding:2px 8px 2px 2px;cursor:pointer;font-size:12.5px;text-decoration:none;color:var(--ink)}
.uses img{width:30px;height:24px;border-radius:2px}

/* dialogs */
dialog{border:0;border-radius:10px;padding:0;max-width:760px;width:calc(100% - 32px);box-shadow:0 20px 60px #0005;color:var(--ink)}
dialog::backdrop{background:#17212B99}
.dh{padding:16px 20px 10px;border-bottom:1px solid var(--line2)}
.dh h2{font-family:var(--head);margin:0;font-size:22px}
.dh p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.db{padding:14px 20px;max-height:65vh;overflow:auto}
.df{padding:12px 20px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.choice{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.choice:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice b{display:block}
.choice span{font-size:13px;color:var(--muted)}
.choice input{float:left;margin:4px 10px 0 0}
.qgrid{display:grid;grid-template-columns:1fr 120px;gap:6px 12px;align-items:center}
.qgrid input{padding:5px 7px;border:1px solid var(--line);border-radius:5px;width:100%}
.qgrid .h{font-size:12px;color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.presets button{border:1px solid var(--line);background:#F3F6F8;border-radius:16px;padding:4px 12px;cursor:pointer;font-size:13px}
.scope{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.scope select{padding:4px 6px;border:1px solid var(--line);border-radius:5px}
.chg{width:100%;border-collapse:collapse;font-size:12.5px}
.chg td{padding:4px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.chg td.s{font-family:var(--mono);color:var(--muted)}
.chg td.o{color:var(--muted);text-decoration:line-through}
.chg td.v{color:var(--amber);font-weight:600}
.warn{background:#FFF3D1;border:1px solid var(--amber-line);border-radius:8px;padding:9px 12px;font-size:13px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 30px #0004;z-index:50;max-width:min(680px,calc(100% - 32px))}
.toast.err{background:var(--danger)}
@media (max-width:820px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto}
  aside{max-height:55vh}
  .bar{flex-wrap:wrap;height:auto;padding:10px 12px}
  .src{flex-basis:100%;order:5}
  .dossier{grid-template-columns:96px 1fr}.dossier .cam{width:96px;height:77px}
  .bars{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
'use strict';
const D = window.RA2DATA;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- encoding (Windows-1252, như game) ---------------- */
const W1252 = {0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
const dec = buf => new TextDecoder('windows-1252').decode(buf);
function enc(str){
  const out = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    out[i] = c < 256 ? c : (W1252[c] ?? 0x3F);
  }
  return out;
}
async function gunzip(b64){
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return dec(await new Response(stream).arrayBuffer());
}

/* ---------------- INI giữ nguyên định dạng ---------------- */
class Ini {
  constructor(text){ this.lines = text.replace(/^\uFEFF/, '').split(/\r?\n/); this.reindex(); }
  reindex(){
    this.secs = new Map(); this.order = [];
    let cur = null;
    this.lines.forEach((ln, i) => {
      const t = ln.trim();
      if (!t || t[0] === ';') { if (cur) cur.last = cur.last; return; }
      const m = t.match(/^\[([^\]]+)\]/);
      if (m){
        const name = m[1].trim(), k = name.toUpperCase();
        cur = this.secs.get(k);
        if (!cur){ cur = {name, keys:new Map(), korder:[], last:i, head:i}; this.secs.set(k, cur); this.order.push(k); }
        cur.last = i;
        return;
      }
      if (!cur) return;
      const eq = ln.indexOf('=');
      if (eq < 0) return;
      const key = ln.slice(0, eq).trim();
      if (!key) return;
      const kk = key.toUpperCase();
      if (!cur.keys.has(kk)) cur.korder.push(kk);
      cur.keys.set(kk, {i, key});
      cur.last = i;
    });
  }
  static splitVal(ln){
    const eq = ln.indexOf('=');
    let rest = ln.slice(eq + 1);
    const sc = rest.indexOf(';');
    const comment = sc >= 0 ? rest.slice(sc) : '';
    if (sc >= 0) rest = rest.slice(0, sc);
    return {val: rest.trim(), comment};
  }
  has(sec){ return this.secs.has(sec.toUpperCase()); }
  sec(sec){ return this.secs.get(sec.toUpperCase()); }
  get(sec, key){
    const s = this.sec(sec); if (!s) return undefined;
    const e = s.keys.get(key.toUpperCase()); if (!e) return undefined;
    return Ini.splitVal(this.lines[e.i]).val;
  }
  keys(sec){
    const s = this.sec(sec); if (!s) return [];
    return s.korder.map(k => { const e = s.keys.get(k); return [e.key, Ini.splitVal(this.lines[e.i]).val]; });
  }
  list(sec){ return this.keys(sec).map(([, v]) => v).filter(v => v); }
  set(sec, key, val){
    const s = this.sec(sec);
    if (s){
      const e = s.keys.get(key.toUpperCase());
      if (e){
        const {comment} = Ini.splitVal(this.lines[e.i]);
        this.lines[e.i] = `${e.key}=${val}${comment ? ' ' + comment.trimStart() : ''}`;
        return;
      }
      this.lines.splice(s.last + 1, 0, `${key}=${val}`);
    } else {
      if (this.lines.length && this.lines[this.lines.length - 1].trim() !== '') this.lines.push('');
      this.lines.push(`[${sec}]`, `${key}=${val}`);
    }
    this.reindex();
  }
  remove(sec, key){
    const s = this.sec(sec); if (!s) return;
    const e = s.keys.get(key.toUpperCase()); if (!e) return;
    // xóa mọi dòng trùng khóa trong mục
    const idx = [];
    for (let i = s.head; i <= s.last; i++){
      const ln = this.lines[i]; const eq = ln.indexOf('=');
      if (eq > 0 && ln.slice(0, eq).trim().toUpperCase() === key.toUpperCase() && ln.trim()[0] !== ';') idx.push(i);
    }
    // mục có thể bị khai báo 2 lần; xóa dòng đang có hiệu lực ít nhất
    if (!idx.includes(e.i)) idx.push(e.i);
    idx.sort((a, b) => b - a).forEach(i => this.lines.splice(i, 1));
    this.reindex();
  }
  text(){ return this.lines.join('\r\n'); }
}

/* ---------------- tham số / nhãn tiếng Việt ---------------- */
const ARMORS = [
  ['none','Không giáp (bộ binh)'],['flak','Flak (bộ binh đặc biệt)'],['plate','Giáp tấm (lính giáp)'],['light','Nhẹ'],['medium','Vừa'],['heavy','Nặng'],
  ['wood','Gỗ'],['steel','Thép'],['concrete','Bê tông'],['special_1','Đặc biệt 1'],['special_2','Đặc biệt 2']];
const SPEEDTYPES = ['Foot','Track','Wheel','Hover','Float','FloatBeach','Amphibious','Winged','Clear','Ramp'];
const GENERIC_PREREQ = ['POWER','PROC','RADAR','TECH','BARRACKS','FACTORY'];

const F = { // key: [nhãn, giải thích, kiểu]
  UIName:['Mã tên hiển thị','Khóa chữ trong file .csf (vd Name:HTNK). Tên thật lấy theo khóa này.','text'],
  Name:['Tên nội bộ','Tên dự phòng khi không có UIName.','text'],
  Cost:['Giá ($)','Số tiền để mua/xây.','int'],
  Strength:['Máu','Độ bền. Càng lớn càng trâu.','int'],
  Armor:['Loại giáp','Quyết định vũ khí nào gây nhiều sát thương lên nó.','armor'],
  Speed:['Tốc độ','Bộ binh ~4, xe tăng ~6, máy bay ~14.','int'],

const iconCache = {};
function icon(name){
  if (!name) return null;

  return iconCache[name] = b ? 'data:image/jpeg;base64,' + b : null;

async function loadGame(g, text, label, sourceKind){
  const st = G[g] || {};
  st.official = st.official || new Ini(await gunzip(D[g].official));
  st.ini = new Ini(text);
  st.opened = new Ini(text);
  st.label = label; st.kind = sourceKind;

  G[g] = st;
  analyse(g);
}

/* phân loại quốc gia / phe */
function analyse(g){
  const st = G[g], ini = st.ini;
  const sides = ini.keys('Sides');
  const code = {}; const order = ['A','S','Y'];
  sides.forEach(([k, v], i) => {
    const c = /gdi/i.test(k) ? 'A' : /nod/i.test(k) ? 'S' : /third/i.test(k) ? 'Y' : (i < 3 ? order[i] : 'N');
    v.split(',').map(x => x.trim()).filter(Boolean).forEach(cn => code[cn.toUpperCase()] = c);
  });
  st.countries = ini.list('Countries').filter(c => ini.has(c) && !/^(gdi|nod|neutral|special)$/i.test(c)).map(c => {
    const ui = ini.get(c, 'UIName'); const nm = (ui && D[g].names[ui.toUpperCase()]) || c;
    return {id:c, name:nm, side: code[c.toUpperCase()] || 'N'};
  });
  st.sideOf = c => code[c.toUpperCase()] || 'N';
}
function nameOf(id){
  const st = cur(); const ui = st.ini.get(id, 'UIName');
  return (ui && D[game].names[ui.toUpperCase()]) || st.ini.get(id, 'Name') || id;
}
function cameoOf(id){
  const st = cur();
  const img = (st.ini.get(id, 'Image') || id).toUpperCase();
  return icon(D[game].art[img] || D[game].art[id.toUpperCase()]);
}
function sidesOf(id, catKey){
  const st = cur(), ini = st.ini;
  const split = v => (v || '').split(',').map(x => x.trim().toUpperCase()).filter(Boolean);
  const own = split(ini.get(id, 'Owner')), req = split(ini.get(id, 'RequiredHouses')), fb = split(ini.get(id, 'ForbiddenHouses'));
  const can = st.countries.filter(c => own.includes(c.id.toUpperCase()) && (!req.length || req.includes(c.id.toUpperCase())) && !fb.includes(c.id.toUpperCase()));
  let s = [...new Set(can.map(c => c.side))];
  if (s.length > 1){
    const pre = (ini.get(id, 'Prerequisite') || '').toUpperCase();
    if (/YACNST|YABRCK|YAWEAP|YATECH|NAPSIS|YAYARD/.test(pre)) s = ['Y'];
    else if (/NACNST|NAHAND|NAWEAP|NATECH|NARADR|NAYARD/.test(pre)) s = ['S'];
    else if (/GACNST|GAPILE|GAWEAP|GATECH|GAYARD/.test(pre)) s = ['A'];
  }
  return s.length ? s : ['N'];
}

function technoIds(){ const ini = cur().ini; return ['InfantryTypes','VehicleTypes','AircraftTypes','BuildingTypes'].flatMap(s => ini.list(s)).filter(id => ini.has(id)); }
function weaponIds(){

/* ---------------- chỉnh sửa + hoàn tác ---------------- */
function apply(ops, record = true){
  // ops: [{sec,key,val}] val=null => xóa
  const st = cur(), batch = [];
  for (const o of ops){
    const old = st.ini.get(o.sec, o.key);
    const nv = o.val === null ? undefined : String(o.val);
    if (old === nv) continue;
    batch.push({sec:o.sec, key:o.key, old, nv});
    if (nv === undefined) st.ini.remove(o.sec, o.key); else st.ini.set(o.sec, o.key, nv);
  }
  if (record && batch.length){ st.undo.push(batch); st.redo = []; }
  if (batch.length) refreshAll();
  return batch.length;
}
function undo(){
  const st = cur(); const b = st.undo.pop(); if (!b) return;
  for (const o of [...b].reverse()){ if (o.old === undefined) st.ini.remove(o.sec, o.key); else st.ini.set(o.sec, o.key, o.old); }
  st.redo.push(b); refreshAll(); toast('Đã hoàn tác ' + b.length + ' thay đổi');
}
function redo(){
  const st = cur(); const b = st.redo.pop(); if (!b) return;
  for (const o of b){ if (o.nv === undefined) st.ini.remove(o.sec, o.key); else st.ini.set(o.sec, o.key, o.nv); }
  st.undo.push(b); refreshAll();
}
function diffs(base){
  const st = cur(), out = [];
  for (const k of st.ini.order){
    const s = st.ini.secs.get(k);
    for (const kk of s.korder){
      const v = st.ini.get(s.name, kk), o = base.get(s.name, kk);
      if ((v ?? '') !== (o ?? '')) out.push({sec:s.name, key:s.keys.get(kk).key, old:o, nv:v});
    }
  }
  for (const k of base.order){
    const s = base.secs.get(k);
    for (const kk of s.korder) if (st.ini.get(s.name, kk) === undefined) out.push({sec:s.name, key:s.keys.get(kk).key, old:base.get(s.name, kk), nv:undefined});
  }
  return out;
}
let chgTimer;

function items(){
  const st = cur(), ini = st.ini, q = $('#q').value.trim().toLowerCase(), off = $('#showoff').checked;
  let ids = [], kind;
  const c = CATS.find(x => x[0] === cat);
  if (['inf','veh','air','bld'].includes(cat)){ ids = ini.list(c[2]).filter(id => ini.has(id)); kind = 'techno'; }
  else if (cat === 'wpn'){ ids = weaponIds(); kind = 'weapon'; }
  else if (cat === 'wh'){ ids = warheadIds(); kind = 'warhead'; }
  else if (cat === 'sw'){ ids = ini.list('SuperWeaponTypes').filter(id => ini.has(id)); kind = 'super'; }
  else if (cat === 'gen'){ ids = ['@general', ...ini.list('Tiberiums').filter(t => ini.has(t)), ...['CombatDamage','Powerups','AudioVisual','JumpjetControls','CrateRules'].filter(s => ini.has(s))]; kind = 'gen'; }
  else { ids = ini.order.map(k => ini.secs.get(k).name); kind = 'raw'; }
  ids = [...new Set(ids)];
  let rows = ids.map(id => {
    const r = {id, kind};
    if (kind === 'techno'){ r.name = nameOf(id); r.sides = sidesOf(id); r.on = buildable(id); r.cost = +ini.get(id, 'Cost') || 0; r.img = cameoOf(id); }
    else if (kind === 'super'){ r.name = (ini.get(id,'UIName') && D[game].names[ini.get(id,'UIName').toUpperCase()]) || id; r.on = true; r.sub = (ini.get(id,'RechargeTime') || '?') + ' phút'; }
    else if (id === '@general'){ r.name = 'Luật chung (General)'; r.on = true; }
    else { r.name = id; r.on = true; }
    return r;
  });
  if (kind === 'techno'){
    if (!off) rows = rows.filter(r => r.on);
    if (sideF !== 'all') rows = rows.filter(r => r.sides.includes(sideF));
    rows.sort((a, b) => (a.sides[0] > b.sides[0]) - (a.sides[0] < b.sides[0]) || a.cost - b.cost || a.name.localeCompare(b.name));
  } else rows.sort((a, b) => a.id === '@general' ? -1 : b.id === '@general' ? 1 : a.name.localeCompare(b.name));
  if (q) rows = rows.filter(r => r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q));
  return rows;
}

    input = `<div class="numrow"><input type="text" inputmode="decimal" id="${uid}" data-k="${esc(key)}" value="${val}"><button data-mul="0.5" data-k="${esc(key)}" title="Giảm một nửa">½</button><button data-mul="1.25" data-k="${esc(key)}" title="+25%">+¼</button><button data-mul="2" data-k="${esc(key)}" title="Gấp đôi">×2</button></div>`;
  } else {
    input = `<input type="text" id="${uid}" data-k="${esc(key)}" value="${val}" ${type === 'prereq' ? 'list="dl_prereq"' : ''}>`;
  }
  const wide = type === 'countries' || type === 'prereq' ? ' wide' : '';
  const was = changed ? `<div class="was"><span>Trước: ${esc(o ?? '(chưa có)')}</span><button data-revert="${esc(key)}">Hoàn lại</button></div>` : '';
  const orig = (off ?? '') !== (v ?? '') && !changed ? `<div class="orig">Bản chính thức: ${esc(off ?? '(không có)')}</div>` : '';
  return `<div class="f${changed ? ' changed' : ''}${wide}"><label for="${uid}">${esc(label)}<span class="k">${esc(key)}</span></label>${help ? `<div class="h">${esc(help)}</div>` : ''}${input}${was}${orig}</div>`;
}
function rawTable(sec){

    const ch = (st.opened.get(sec, k) ?? '') !== (v ?? '');
    return `<tr class="${ch ? 'changed' : ''}"><td class="key">${esc(k)}</td><td><input data-k="${esc(k)}" value="${esc(v)}" aria-label="${esc(k)}"></td><td class="x"><button data-del="${esc(k)}" title="Xóa thuộc tính">×</button></td></tr>`;
  }).join('');
  return `<table class="raw">${rows}</table>

function datalists(){
  const ini = cur().ini;

    <datalist id="dl_projectile">${opt(projectileIds())}</datalist><datalist id="dl_prereq">${opt([...GENERIC_PREREQ, ...blds])}</datalist>`;
}

/* ---------------- trang chi tiết ---------------- */
function statBars(id){
  const ini = cur().ini;
  const c = CATS.find(x => x[0] === cat);
  const peers = c && c[2] && ['inf','veh','air','bld'].includes(cat) ? ini.list(c[2]).filter(x => ini.has(x) && buildable(x)) : technoIds().filter(buildable);
  const S = [['Cost','Giá'],['Strength','Máu'],[cat === 'bld' ? 'Power' : 'Speed', cat === 'bld' ? 'Điện' : 'Tốc độ'],['Sight','Tầm nhìn']];
  return '<div class="bars">' + S.map(([k, l]) => {
    const v = parseFloat(ini.get(id, k)) || 0;
    const mx = Math.max(1, ...peers.map(p => Math.abs(parseFloat(ini.get(p, k)) || 0)));
    return `<div><div class="lab"><span>${l}</span><b>${ini.get(id, k) ?? '–'}</b></div><div class="track"><div class="fill" style="width:${Math.min(100, Math.abs(v) / mx * 100)}%"></div></div></div>`;
  }).join('') + '</div>';
}
function usedBy(id, keys){
  const ini = cur().ini, out = [];
  technoIds().forEach(t => { if (keys.some(k => (ini.get(t, k) || '').toUpperCase() === id.toUpperCase())) out.push(t); });
  return out;
}
function renderDetail(id, keepScroll){

    h += `<section class="grp"><h3>Quy tắc chính</h3><div class="fields">${GENERAL_FIELDS.map(([s, k, l, hp, t]) => fieldHTML(s, k, [l, hp, t])).join('')}</div></section>`;
    h += `<section class="grp"><h3>Tất cả thuộc tính của [General]</h3>${rawTable('General')}</section>`;

  } else {

    const kindLabel = {techno:CATS.find(x => x[0] === cat)?.[1] || 'Đơn vị', weapon:'Vũ khí', warhead:'Đầu nổ', super:'Siêu vũ khí', gen:'Luật chung', raw:'Mục'}[kind];
    h += `<div class="dossier" style="${isTech ? '' : 'grid-template-columns:1fr'}">${isTech ? (img ? `<img class="cam" src="${img}" alt="">` : '<div class="cam noimg"></div>') : ''}
      <div><h1>${esc(title)}</h1><div class="meta"><code>${esc(id)}</code><span>${kindLabel}</span>
      ${sides.map(s => `<span class="side-tag" style="background:${SIDE_COLOR[s]}">${SIDE_NAME[s]}</span>`).join('')}

function versesHTML(wh, title){
  const ini = cur().ini;

    <div class="verses" data-wh="${esc(wh)}">${ARMORS.map(([a, l], i) => {
      const ch = (v[i] ?? '') !== (o[i] ?? '');
      return `<div class="f${ch ? ' changed' : ''}"><label>${l}</label><input type="text" data-verse="${i}" value="${esc(v[i] ?? '')}" style="width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:5px">${ch ? `<div class="was"><span>Trước: ${esc(o[i] ?? '')}</span></div>` : ''}</div>`;

}

function numFix(v){ const n = parseFloat(v); return Number.isFinite(n) ? n : null; }

const FS = 'showDirectoryPicker' in window;
async function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('ra2modeditor', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function saveHandle(h){ try { const db = await idb(); db.transaction('h', 'readwrite').objectStore('h').put(h, 'dir'); } catch {} }
async function loadHandle(){ try { const db = await idb(); return await new Promise(r => { const q = db.transaction('h').objectStore('h').get('dir'); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch { return null; } }
async function fileText(name){
  try { const fh = await dir.getFileHandle(name); return dec(await (await fh.getFile()).arrayBuffer()); } catch { return null; }
}
async function fileExists(name){ try { await dir.getFileHandle(name); return true; } catch { return false; } }

async function pickFolder(handle){
  try {
    if (!handle) handle = await window.showDirectoryPicker({id:'ra2026', mode:'readwrite'});
    if ((await handle.queryPermission({mode:'readwrite'})) !== 'granted' && (await handle.requestPermission({mode:'readwrite'})) !== 'granted') throw new Error('perm');
    const has = async n => { try { await handle.getFileHandle(n); return true; } catch { return false; } };
    if (!(await has('gamemd.exe')) && !(await has('game.exe'))){ toast('Thư mục này không có game.exe hay gamemd.exe. Hãy chọn thư mục E:\\games\\Ra2\\Ra2026.', true); return false; }
    dir = handle; saveHandle(handle);
    return true;
  } catch (err){
    if (err.name !== 'AbortError') toast(err.message === 'perm' ? 'Chưa được cấp quyền ghi vào thư mục.' : 'Không mở được thư mục: ' + err.message, true);
    return false;
  }
}

async function startDialog(g){

  const opts = [];
  if (loose !== null) opts.push(['loose', `File ${looseName} trong thư mục (game đang dùng)`, 'Tiếp tục từ những gì đang có trong thư mục game.']);
  opts.push(['mod', `Bản mod có sẵn (${D[g].modSource})`, g === 'yr' ? 'Bộ luật mod đi kèm bản game này: xây nhanh, hoàn tiền 100%, thêm 51 quân mới.' : 'Bộ luật mod đi kèm bản game này: thêm hơn 30 bộ binh và gần 40 xe.']);
  opts.push(['official', 'Bản chính thức của Westwood', 'Luật gốc, không mod. Lưu lại sẽ đưa game về chuẩn.']);
  dlg.innerHTML = `<div class="dh"><h2>Bắt đầu chỉnh ${gname}</h2><p>Chọn bộ luật để làm việc. Bạn có thể đổi lại bất kỳ lúc nào bằng nút Khôi phục.</p></div>
   <div class="db">${dir ? '' : `<div class="warn">${FS ? 'Chưa mở thư mục Ra2026: bạn vẫn chỉnh được, nhưng khi lưu sẽ phải tải file về và tự chép vào thư mục game. Bấm “Mở thư mục Ra2026” để lưu thẳng vào game.' : 'Trình duyệt này không hỗ trợ ghi thẳng vào thư mục. Hãy mở file bằng Chrome hoặc Edge; ở đây bạn vẫn chỉnh được và lưu bằng cách tải file về.'}</div>`}
   ${opts.map(([k, t, d], i) => `<label class="choice"><input type="radio" name="src" value="${k}" ${i === 0 ? 'checked' : ''}><b>${t}</b><span>${d}</span></label>`).join('')}
   ${!dir ? `<label class="choice"><input type="radio" name="src" value="file"><b>Mở một file ${looseName} khác…</b><span>Chọn file .ini trên máy.</span></label>` : ''}</div>
   <div class="df">${!dir && FS ? '<button class="btn" id="st-folder">Mở thư mục Ra2026</button>' : ''}<button class="btn primary" id="st-go">Bắt đầu chỉnh</button></div>`;
  dlg.showModal();
  return new Promise(res => {
    $('#st-folder', dlg)?.addEventListener('click', async () => { if (await pickFolder()){ dlg.close(); updateSrc(); res(await startDialog(g)); } });
    $('#st-go', dlg).onclick = async () => {

      else if (k === 'mod'){ text = await gunzip(D[g].mod); label = `bản mod có sẵn (${D[g].modSource})`; }
      else { text = await gunzip(D[g].official); label = 'bản chính thức'; }
      await loadGame(g, text, label, k);
      dlg.close(); res(true);
    };
  });
}

/* ---------------- lưu ---------------- */
function stamp(){ const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
async function backup(name){
  const old = await fileText(name); if (old === null) return null;
  const bdir = await dir.getDirectoryHandle('mod_backups', {create:true});
  const bn = name.replace(/\.ini$/i, '') + '_' + stamp() + '.ini';
  const fh = await bdir.getFileHandle(bn, {create:true}); const w = await fh.createWritable(); await w.write(enc(old)); await w.close();
  return 'mod_backups\\' + bn;
}
async function writeFile(name, text){
  const fh = await dir.getFileHandle(name, {create:true}); const w = await fh.createWritable(); await w.write(enc(text)); await w.close();
}
function download(name, text){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([enc(text)], {type:'text/plain'})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

    <p>Sau khi lưu, mở <b>${game === 'yr' ? 'Play_YR.exe' : 'Play_RA2.exe'}</b> để chơi thử. File ${name} trong thư mục được game ưu tiên hơn luật trong các file .mix.</p>
    <div class="warn">Chơi LAN: mọi máy phải dùng cùng file ${name}, nếu không trận đấu sẽ lỗi đồng bộ.</div></div>
    <div class="df"><button class="btn" id="sv-dl">Chỉ tải file về</button><button class="btn" id="sv-cancel">Hủy</button>${dir ? '<button class="btn primary" id="sv-go">Lưu vào thư mục game</button>' : ''}</div>`;
  dlg.showModal();
  $('#sv-cancel').onclick = () => dlg.close();
  $('#sv-dl').onclick = () => { download(name, st.ini.text()); dlg.close(); toast('Đã tải ' + name + '. Chép file này vào thư mục Ra2026.'); };
  const go = $('#sv-go'); if (go) go.onclick = async () => {
    try {
      const b = await backup(name); await writeFile(name, st.ini.text());
      st.opened = new Ini(st.ini.text()); st.kind = 'loose'; st.label = `${name} trong thư mục game`;
      dlg.close(); updateSrc(); refreshAll();
      toast(`Đã lưu ${name}${b ? ' (bản cũ: ' + b + ')' : ''}. Mở ${game === 'yr' ? 'Play_YR' : 'Play_RA2'} để chơi thử.`);
    } catch (err){ toast('Không lưu được: ' + err.message, true); }
  };
}
$('#b-save').onclick = openSave;

/* ---------------- khôi phục ---------------- */
$('#b-restore').onclick = () => {
  const name = D[game].file, dlg = $('#dlg-restore');
  const gname = game === 'yr' ? "Yuri's Revenge" : 'Red Alert 2';
  dlg.innerHTML = `<div class="dh"><h2>Khôi phục ${gname}</h2><p>Nạp lại một bộ luật vào trình chỉnh${dir ? ' và ghi luôn vào game' : ''}. File hiện tại được sao lưu trước.</p></div>
    <div class="db">
    <label class="choice"><input type="radio" name="rs" value="official" checked><b>Về bản chính thức (không mod)</b><span>Ghi luật gốc của Westwood thành ${name}.</span></label>
    <label class="choice"><input type="radio" name="rs" value="mod"><b>Về bản mod có sẵn</b><span>${game === 'yr' ? `Xóa ${name} rời để game dùng lại luật trong expandmd03.mix.` : `Ghi lại bộ luật mod đi kèm game thành ${name}.`}</span></label>
    <label class="choice"><input type="radio" name="rs" value="opened"><b>Bỏ mọi chỉnh sửa chưa lưu</b><span>Trở về trạng thái lúc mở/lưu gần nhất, không ghi gì vào game.</span></label></div>
    <div class="df"><button class="btn" id="rs-cancel">Hủy</button><button class="btn primary" id="rs-go">Khôi phục</button></div>`;
  dlg.showModal();
  $('#rs-cancel').onclick = () => dlg.close();
  $('#rs-go').onclick = async () => {
    const k = $('input[name=rs]:checked', dlg).value, st = cur();
    try {
      if (k === 'opened'){ await loadGame(game, st.opened.text(), st.label, st.kind); }
      else {
        const text = await gunzip(D[game][k]);
        if (dir){
          const b = await backup(name);
          if (k === 'mod' && game === 'yr'){ try { await dir.removeEntry(name); } catch {} }
          else await writeFile(name, text);
          await loadGame(game, text, k === 'mod' && game === 'yr' ? `bản mod có sẵn (${D[game].modSource})` : `${name} trong thư mục game`, k === 'mod' && game === 'yr' ? 'mod' : 'loose');
          toast(`Đã khôi phục ${k === 'official' ? 'bản chính thức' : 'bản mod có sẵn'}${b ? ' (bản cũ: ' + b + ')' : ''}.`);
        } else { await loadGame(game, text, k === 'official' ? 'bản chính thức' : `bản mod có sẵn (${D[game].modSource})`, k); toast('Đã nạp. Bấm “Lưu vào game” để tải file về.'); }
      }
      dlg.close(); updateSrc(); sel = null; refreshAll(); const f = items()[0]; if (f) renderDetail(f.id);
    } catch (err){ toast('Không khôi phục được: ' + err.message, true); }
  };
};

/* ---------------- danh sách thay đổi ---------------- */
$('#b-changes').onclick = () => {
  const dlg = $('#dlg-changes');
  const draw = mode => {
    const st = cur(); const base = mode === 'official' ? st.official : st.opened;
    const d = diffs(base);
    dlg.innerHTML = `<div class="dh"><h2>Thay đổi</h2><p>So với: <select id="cmp"><option value="opened" ${mode === 'opened' ? 'selected' : ''}>lúc mở / lần lưu gần nhất</option><option value="official" ${mode === 'official' ? 'selected' : ''}>bản chính thức của Westwood</option></select> · ${d.length} dòng khác</p></div>
      <div class="db">${d.length ? `<table class="chg">${d.slice(0, 800).map(x => `<tr><td class="s">[${esc(x.sec)}] ${esc(x.key)}</td><td class="o">${esc(x.old ?? '(không có)')}</td><td class="v">${esc(x.nv ?? '(đã xóa)')}</td><td>${mode === 'opened' ? `<button class="btn" data-rv="${esc(x.sec)}|${esc(x.key)}">Hoàn lại</button>` : `<a data-go="all:${esc(x.sec)}" style="cursor:pointer;color:var(--allied)">Xem</a>`}</td></tr>`).join('')}</table>${d.length > 800 ? `<p>… và ${d.length - 800} dòng nữa.</p>` : ''}` : '<p>Chưa có thay đổi nào.</p>'}</div>
      <div class="df"><button class="btn primary" id="cg-close">Đóng</button></div>`;
    $('#cmp', dlg).onchange = e => draw(e.target.value);
    $('#cg-close', dlg).onclick = () => dlg.close();
    $$('[data-rv]', dlg).forEach(b => b.onclick = () => { const [s, k] = b.dataset.rv.split('|'); apply([{sec:s, key:k, val: cur().opened.get(s, k) ?? null}]); draw(mode); });
    $$('[data-go]', dlg).forEach(a => a.addEventListener('click', () => dlg.close()));
  };
  draw('opened'); dlg.showModal();
};

/* ---------------- mod nhanh ---------------- */
const QOPS = [
  ['cost','Giá quân & công trình','×0.5 = rẻ một nửa'],
  ['hp','Máu','×2 = trâu gấp đôi'],
  ['speed','Tốc độ di chuyển',''],
  ['sight','Tầm nhìn',''],
  ['dmg','Sát thương vũ khí','áp cho vũ khí của các quân được chọn'],
  ['range','Tầm bắn',''],
  ['rof','Tốc độ bắn','×2 = bắn nhanh gấp đôi'],
  ['sw','Thời gian hồi siêu vũ khí','×0.5 = hồi nhanh gấp đôi'],
  ['build','Thời gian xây (toàn trận)','×0.5 = xây nhanh gấp đôi'],
  ['ore','Giá trị quặng & đá quý','×2 = gấp đôi tiền'],
];
const PRESETS = [
  ['Rẻ 50%', {cost:0.5}], ['Xây nhanh ×2', {build:0.5}], ['Quân trâu ×2', {hp:2}], ['Hỏa lực ×2', {dmg:2}],
  ['Kinh tế ×2', {ore:2}], ['Siêu vũ khí hồi nhanh ×2', {sw:0.5}], ['Tốc độ ×1.5', {speed:1.5}],
];
$('#b-quick').onclick = () => {
  const dlg = $('#dlg-quick');
  dlg.innerHTML = `<div class="dh"><h2>Mod nhanh</h2><p>Nhân hàng loạt chỉ số. Để trống ô nào thì không đổi ô đó. Có thể hoàn tác bằng Ctrl+Z.</p></div>
   <div class="db">
    <div class="presets">${PRESETS.map((p, i) => `<button data-p="${i}">${p[0]}</button>`).join('')}</div>
    <div class="scope">Áp dụng cho
      <select id="qs-side"><option value="all">mọi phe</option><option value="A">Đồng Minh</option><option value="S">Liên Xô</option>${game === 'yr' ? '<option value="Y">Yuri</option>' : ''}</select>
      <select id="qs-cat"><option value="all">mọi loại</option><option value="InfantryTypes">bộ binh</option><option value="VehicleTypes">xe & tàu</option><option value="AircraftTypes">máy bay</option><option value="BuildingTypes">công trình</option></select>
      <label><input type="checkbox" id="qs-on" checked> chỉ mục xây được</label></div>
    <div class="qgrid">${QOPS.map(([k, l, h]) => `<div><b>${l}</b>${h ? `<div class="h">${h}</div>` : ''}</div><input id="qo-${k}" inputmode="decimal" placeholder="×1">`).join('')}</div>
    <p id="q-prev" class="h" style="color:var(--muted);margin-top:10px"></p></div>
   <div class="df"><button class="btn" id="q-cancel">Đóng</button><button class="btn primary" id="q-go">Áp dụng</button></div>`;
  dlg.showModal();
  const prev = () => { const t = quickTargets(); $('#q-prev').textContent = `Sẽ ảnh hưởng ${t.units.length} quân/công trình và ${t.weapons.length} vũ khí.`; };
  $$('[data-p]', dlg).forEach(b => b.onclick = () => { QOPS.forEach(([k]) => $('#qo-' + k).value = ''); Object.entries(PRESETS[b.dataset.p][1]).forEach(([k, v]) => $('#qo-' + k).value = v); });
  $$('select,#qs-on', dlg).forEach(x => x.onchange = prev); prev();
  $('#q-cancel').onclick = () => dlg.close();
  $('#q-go').onclick = () => {
    const m = {}; QOPS.forEach(([k]) => { const v = parseFloat($('#qo-' + k).value.replace(',', '.')); if (Number.isFinite(v) && v > 0 && v !== 1) m[k] = v; });
    if (!Object.keys(m).length){ toast('Nhập ít nhất một hệ số khác 1.', true); return; }
    const n = quickApply(m); dlg.close(); toast(`Đã đổi ${n} giá trị. Bấm Hoàn tác nếu muốn bỏ.`);
  };
};
function quickTargets(){
  const ini = cur().ini, side = $('#qs-side').value, c = $('#qs-cat').value, on = $('#qs-on').checked;
  const lists = c === 'all' ? ['InfantryTypes','VehicleTypes','AircraftTypes','BuildingTypes'] : [c];
  const units = lists.flatMap(l => ini.list(l)).filter(id => ini.has(id) && (!on || buildable(id)) && (side === 'all' || sidesOf(id).includes(side)));
  const weapons = [...new Set(units.flatMap(id => WEAPON_KEYS.map(k => ini.get(id, k)).filter(w => w && ini.has(w))))];
  return {units:[...new Set(units)], weapons};
}
function quickApply(m){
  const ini = cur().ini, {units, weapons} = quickTargets(), ops = [];
  const mul = (sec, key, f, int, min) => { const v = parseFloat(ini.get(sec, key)); if (!Number.isFinite(v)) return; let n = v * f; n = int ? Math.round(n) : +n.toFixed(3); if (min !== undefined && Math.abs(n) < min && v !== 0) n = Math.sign(v) * min; ops.push({sec, key, val:n}); };
  units.forEach(id => {
    if (m.cost) mul(id, 'Cost', m.cost, true, 1);
    if (m.hp) mul(id, 'Strength', m.hp, true, 1);
    if (m.speed) mul(id, 'Speed', m.speed, true, 1);
    if (m.sight) mul(id, 'Sight', m.sight, true, 1);
  });
  weapons.forEach(w => {
    if (m.dmg) mul(w, 'Damage', m.dmg, true, 1);
    if (m.range) mul(w, 'Range', m.range, false);
    if (m.rof) mul(w, 'ROF', 1 / m.rof, true, 1);
  });
  if (m.sw) ini.list('SuperWeaponTypes').forEach(s => ini.has(s) && mul(s, 'RechargeTime', m.sw, false));
  if (m.build) mul('General', 'BuildSpeed', m.build, false);
  if (m.ore) ini.list('Tiberiums').forEach(t => ini.has(t) && mul(t, 'Value', m.ore, true, 1));
  return apply(ops);
}

/* ---------------- nhân bản ---------------- */
function openClone(id){
  const dlg = $('#dlg-clone'), ini = cur().ini;
  const listSec = ['InfantryTypes','VehicleTypes','AircraftTypes','BuildingTypes'].find(s => ini.list(s).some(x => x.toUpperCase() === id.toUpperCase()));
  dlg.innerHTML = `<div class="dh"><h2>Nhân bản ${esc(nameOf(id))}</h2><p>Tạo một quân mới có cùng hình ảnh và chỉ số, rồi chỉnh tiếp tùy ý.</p></div>
    <div class="db"><div class="qgrid"><div><b>Mã mới</b><div class="h">Chữ in hoa, không dấu, không trùng (vd ${esc(id)}2).</div></div><input id="cl-id" value="${esc(id)}2">
    <div><b>Tên hiển thị</b><div class="h">Tên trong game sẽ lấy từ quân gốc; tên này dùng trong trình chỉnh.</div></div><input id="cl-name" value="${esc(nameOf(id))} (mới)"></div></div>
    <div class="df"><button class="btn" id="cl-cancel">Hủy</button><button class="btn primary" id="cl-go">Tạo quân mới</button></div>`;
  dlg.showModal();
  $('#cl-cancel').onclick = () => dlg.close();
  $('#cl-go').onclick = () => {
    const nid = $('#cl-id').value.trim().toUpperCase();
    if (!/^[A-Z0-9_]{2,24}$/.test(nid)){ toast('Mã chỉ gồm chữ A–Z, số và dấu gạch dưới (2–24 ký tự).', true); return; }
    if (ini.has(nid)){ toast('Mã ' + nid + ' đã tồn tại.', true); return; }
    const ops = ini.keys(id).filter(([k]) => !/^Name$/i.test(k)).map(([k, v]) => ({sec:nid, key:k, val:v}));
    if (ini.get(id, 'Image') === undefined) ops.push({sec:nid, key:'Image', val:id});
    ops.push({sec:nid, key:'Name', val:$('#cl-name').value.trim() || nid});
    const nums = ini.keys(listSec).map(([k]) => parseInt(k)).filter(Number.isFinite);
    ops.push({sec:listSec, key:String((nums.length ? Math.max(...nums) : 0) + 1), val:nid});
    apply(ops); dlg.close(); renderDetail(nid); toast('Đã tạo ' + nid + '. Nhớ Lưu vào game để dùng.');
  };
}

/* ---------------- tiện ích ---------------- */
let toastT;
function toast(msg, err){
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 6000 : 4000);
}

/* ---------------- khởi động ---------------- */
(async function init(){
  $('#empty').innerHTML = `<h2>Chỉnh luật chơi Red Alert 2 & Yuri's Revenge</h2>
    <p>Chọn quân ở cột trái để sửa giá, máu, tốc độ, vũ khí; dùng <b>Mod nhanh</b> để nhân hàng loạt; bấm <b>Lưu vào game</b> để ghi file luật vào thư mục Ra2026.</p>
    <p>Mọi thay đổi có thể hoàn tác (Ctrl+Z) và file cũ luôn được sao lưu trong thư mục <b>mod_backups</b>.</p>`;
  if (typeof DecompressionStream === 'undefined'){ toast('Trình duyệt quá cũ. Hãy mở bằng Chrome hoặc Edge bản mới.', true); return; }
  const h = FS ? await loadHandle() : null;
  if (h){
    try { if ((await h.queryPermission({mode:'readwrite'})) === 'granted') dir = h; } catch {}
  }
  updateSrc();
  if (h && !dir){
    // cần thao tác người dùng để cấp lại quyền
    const dlg = $('#dlg-start');
    dlg.innerHTML = `<div class="dh"><h2>Mở lại thư mục ${esc(h.name)}?</h2><p>Lần trước bạn đã dùng thư mục này. Trình duyệt cần bạn xác nhận lại quyền ghi.</p></div>
      <div class="df"><button class="btn" id="rh-no">Không, chọn khác</button><button class="btn primary" id="rh-yes">Mở lại</button></div>`;
    dlg.showModal();
    await new Promise(r => { $('#rh-yes').onclick = async () => { await pickFolder(h); dlg.close(); r(); }; $('#rh-no').onclick = () => { dlg.close(); r(); }; });
    updateSrc();
  }
  await switchGame('yr');
})();
</script>
