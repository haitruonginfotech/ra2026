Metadata:
	Title: RA Reborn
	Description: Red Alert 2 + Yuri's Revenge reborn on the OpenRA engine: 3 factions, 4 veterancy ranks.
	Version: {DEV_VERSION}
	Author: RA Reborn (haitruonginfotech), based on the OpenRA RA2 mod team

ModCredits:
	ModTabTitle: Red Alert 2
	ModCreditsFile: rareborn|CREDITS # TODO rename to AUTHORS as stated in the .cs files when OpenRA#17460 is available

PackageFormats: Mix, AudioBag

Packages:
	# RA Reborn đọc thẳng file game RA2/YR trong thư mục Ra2026 nằm cạnh thư mục RA Reborn
	# (vd E:\games\Ra2\RAReborn và E:\games\Ra2\Ra2026); hai dòng dưới cho bản chạy từ mã nguồn và bản đóng gói,
	# hoặc trong Support/Content/rareborn nếu bạn chép file game vào đó.
	~^EngineDir|../Ra2026
	~^EngineDir|../../Ra2026
	~^SupportDir|Content/rareborn
	^EngineDir
	$rareborn: rareborn
	^EngineDir|mods/common: common
	~ra2.mix
