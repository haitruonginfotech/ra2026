AssetBrowser:
	SpriteExtensions: .shp, .tem, .urb, .sno
	ModelExtensions: .vxl
	AudioExtensions: .aud, .wav
	VideoExtensions: .vqa

GameSpeeds:
	DefaultSpeed: default
	Speeds:
		slowest:
			Name: options-game-speed.slowest
			Timestep: 80
			OrderLatency: 2
		slower:
			Name: options-game-speed.slower
			Timestep: 50
			OrderLatency: 3
		default:
			Name: options-game-speed.normal
			Timestep: 40
			OrderLatency: 3
		fast:
			Name: options-game-speed.fast
			Timestep: 35
			OrderLatency: 4
		faster:
			Name: options-game-speed.faster
			Timestep: 30
			OrderLatency: 4
		fastest:
			Name: options-game-speed.fastest
			Timestep: 20
			OrderLatency: 6

ModContent:
	InstallPromptMessage: RA Reborn needs the original Red Alert 2 + Yuri's Revenge files. Put the game folder next to RA Reborn as ../Ra2026.
	HeaderMessage: The original game content must be copied from an original game disc.
	Packages:
		ContentPackage@base:
			Title: Base Game Files
			Identifier: base
			TestFiles: ^EngineDir|../Ra2026/ra2.mix, ^EngineDir|../Ra2026/language.mix
			Sources: ra2, origin, tfd
			Required: true
		ContentPackage@music:
			Title: Game Music
			Identifier: music
			TestFiles: ^EngineDir|../Ra2026/theme.mix
			Sources: ra2, origin, tfd
	Sources:
		rareborn|installer/ra2.yaml
		rareborn|installer/origin.yaml
		rareborn|installer/firstdecade.yaml
